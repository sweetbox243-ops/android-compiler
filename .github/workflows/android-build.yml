name: Build Android APK

# Déclencheurs du workflow
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permet de lancer le build manuellement depuis l'onglet Actions

jobs:
  build:
    # Utilisation de la dernière version d'Ubuntu avec les outils Android préinstallés
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code source
      - name: Checkout du code
        uses: actions/checkout@v4

      # 2. Installation et configuration de Java (JDK 17 obligatoire pour les projets modernes)
      - name: Configuration du JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle' # Met en cache les dépendances Gradle pour accélérer les futurs builds

      # 3. Attribution des droits d'exécution au script de compilation Gradle
      - name: Rendre gradlew exécutable
        run: chmod +x gradlew

      # 4. Lancement de la compilation de l'APK en mode Debug
      - name: Compiler l'APK (Debug)
        run: ./gradlew assembleDebug

      # 5. Sauvegarde de l'APK généré pour le rendre téléchargeable
      - name: Télécharger l'artefact APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/maestro-webview.apk
          retention-days: 14 # Durée de conservation de l'APK sur GitHub (14 jours)
