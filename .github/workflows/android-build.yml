name: Build Android APK

# Déclencheurs : s'exécute à chaque push ou pull request sur la branche main/master
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    # Utilisation d'une machine virtuelle Linux (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code source du projet
      - name: Checkout du code
        uses: actions/checkout@v4

      # 2. Configurer Java (JDK 17 est recommandé pour les projets Android modernes)
      - name: Configurer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle' # Active le cache Gradle pour accélérer les futurs builds

      # 3. Donner les droits d'exécution au script Gradle Wrapper
      - name: Rendre gradlew exécutable
        run: chmod +x gradlew

      # 4. Lancer la compilation de l'APK (ici en mode Debug)
      - name: Compiler l'APK (Debug)
        run: ./gradlew assembleDebug

      # 5. Sauvegarder l'APK en tant qu'artefact téléchargeable
      - name: Télécharger l'artefact APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
